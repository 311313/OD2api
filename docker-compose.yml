services:
  opendesign2api:
    build:
      context: .
      args:
        # 版本信息由宿主机 auto-update.sh 传入；本地构建留空显示 dev
        GIT_SHA: ${GIT_SHA:-}
        BUILD_TIME: ${BUILD_TIME:-}
    container_name: opendesign2api
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - PORT=7890
      - DATA_DIR=/app/data
      # 涓嬫父璋冪敤鏈綉鍏崇殑 key锛坰ub2api 娓犻亾閲屽～杩欎釜锛?
      - GATEWAY_API_KEY=${GATEWAY_API_KEY:-}
      # 绠＄悊闈㈡澘浠ょ墝锛堢暀绌哄垯闈㈡澘鍏嶇櫥褰曪紝浠呭缓璁厤鍚堝洖鐜闂級
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - MAX_ATTEMPTS=${MAX_ATTEMPTS:-4}
      - MIN_BALANCE_USD=${MIN_BALANCE_USD:-0.0005}
      - BALANCE_REFRESH_MINUTES=${BALANCE_REFRESH_MINUTES:-5}
      - STRIP_EXTRA_FIELDS=${STRIP_EXTRA_FIELDS:-true}
      - REWRITE_MODEL_NAME=${REWRITE_MODEL_NAME:-true}
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-30}
    ports:
      # 涓庢湇鍔″櫒涓婂叾瀹?2api 椤圭洰涓€鑷达細鍙粦鍥炵幆锛岀敱 cloudflared / nginx 瀵瑰
      - "127.0.0.1:7890:7890"
    volumes:
      - ./data:/app/data
    networks:
      - default
      # 可选：接入下游网关所在的 docker 网络，使其能用容器名直连本网关。
      # 网络名由 .env 的 UPSTREAM_NETWORK 提供；留空则只挂在 default 上。
      - upstream

networks:
  default:
    name: opendesign2api_default
  upstream:
    # 留空时 compose 会拒绝启动，所以给一个确定不存在的名字 + external，
    # 只有 .env 里显式设置 UPSTREAM_NETWORK 时才真正接入。
    name: ${UPSTREAM_NETWORK:-opendesign2api_standalone}
    external: true
