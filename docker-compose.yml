services:
  opendesign2api:
    build:
      context: .
      args:
        # 版本信息由宿主机 auto-update.sh 传入；本地构建留空显示 dev
        GIT_SHA: ${GIT_SHA:-}
        BUILD_TIME: ${BUILD_TIME:-}
    container_name: opendesign2api
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - PORT=7890
      - DATA_DIR=/app/data
      # 下游调用本网关时使用的 key
      - GATEWAY_API_KEY=${GATEWAY_API_KEY:-}
      # 管理面板令牌；留空则首次启动随机生成
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - MAX_ATTEMPTS=${MAX_ATTEMPTS:-4}
      - MIN_BALANCE_USD=${MIN_BALANCE_USD:-0.0005}
      - BALANCE_REFRESH_MINUTES=${BALANCE_REFRESH_MINUTES:-5}
      - STRIP_EXTRA_FIELDS=${STRIP_EXTRA_FIELDS:-true}
      - REWRITE_MODEL_NAME=${REWRITE_MODEL_NAME:-true}
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-30}
    ports:
      # 只绑回环：对外暴露由使用者自己的反向代理或隧道负责
      - "127.0.0.1:7890:7890"
    volumes:
      - ./data:/app/data
    networks:
      - default
      # 可选：接入下游所在的 docker 网络，使其可用容器名直连本网关。
      # 需要该网络已存在；不需要就保持 UPSTREAM_NETWORK 为默认值。
      - upstream

networks:
  default:
    name: opendesign2api_default
  upstream:
    # 默认值指向一个独立网络，避免与 default 重名；
    # 使用前先创建：docker network create od2api-upstream
    # 或在 .env 里指定一个已存在的网络名。
    name: ${UPSTREAM_NETWORK:-od2api-upstream}
    external: true
