services:
  opendesign2api:
    build:
      context: .
      args:
        # 版本信息由宿主机 auto-update.sh 传入；本地构建留空显示 dev
        GIT_SHA: ${GIT_SHA:-}
        BUILD_TIME: ${BUILD_TIME:-}
    container_name: opendesign2api
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - PORT=7890
      - DATA_DIR=/app/data
      # 下游调用本网关时使用的 key
      - GATEWAY_API_KEY=${GATEWAY_API_KEY:-}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - MAX_ATTEMPTS=${MAX_ATTEMPTS:-4}
      - MIN_BALANCE_USD=${MIN_BALANCE_USD:-0.0005}
      - BALANCE_REFRESH_MINUTES=${BALANCE_REFRESH_MINUTES:-5}
      - STRIP_EXTRA_FIELDS=${STRIP_EXTRA_FIELDS:-true}
      - REWRITE_MODEL_NAME=${REWRITE_MODEL_NAME:-true}
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-30}
    ports:
      # 只绑回环：对外暴露由使用者自己的反向代理或隧道负责
      - "127.0.0.1:7890:7890"
    volumes:
      - ./data:/app/data
    networks:
      - default

networks:
  # 独立默认网络：不依赖任何外部前置条件，新部署可直接 up
  default:
    name: opendesign2api_default
